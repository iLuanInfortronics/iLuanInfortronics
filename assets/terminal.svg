<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Stack de Luan Rodrigues</title>
  <desc id="descricao">Digitação animada das tecnologias: C#/.NET, SQL Server, PostgreSQL, JavaScript, HTML, CSS, Flutter, Dart e Java.</desc>
  <style>
    /* #region Terminal e tipografia */
    :root { --fundo: #0b1c30; --texto: #e7f0ff; --azul: #79b8ff; --ambar: #ffc56e; --borda: #29435e; }
    text { font-family: Consolas, 'Courier New', monospace; font-size: 21px; fill: var(--texto); }
    .comando { fill: var(--ambar); }
    .linha { animation: digitar 16s steps(60, end) infinite; }
    .segunda { animation-delay: 1.3s; }
    .terceira { animation-delay: 2.6s; }
    .cursor { animation: piscar 1.2s step-end infinite; }
    /* #endregion */
    /* #region Digitação acessível */
    @keyframes digitar { 0% { clip-path: inset(0 100% 0 0); } 18%, 100% { clip-path: inset(0 0 0 0); } }
    @keyframes piscar { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .linha, .cursor { animation: none; } }
    /* #endregion */
  </style>
  <rect x="1" y="1" width="1198" height="250" rx="12" fill="var(--fundo)" stroke="var(--borda)"/>
  <path d="M1 49H1199" stroke="var(--borda)"/>
  <circle cx="27" cy="25" r="5" fill="#ffc56e"/><circle cx="47" cy="25" r="5" fill="#79b8ff"/><circle cx="67" cy="25" r="5" fill="#b3c7df"/>
  <text x="98" y="32">luan / tecnologias</text>
  <text x="1149" y="32" text-anchor="end">UTF-8</text>
  <text x="30" y="92" class="comando">&gt; perfil.exibir()</text>
  <g class="linha"><text x="30" y="132"><tspan fill="#79b8ff">atuação </tspan> engenharia de IA + desenvolvimento full-stack</text></g>
  <g class="linha segunda"><text x="30" y="169"><tspan fill="#79b8ff">web     </tspan> C# / .NET / SQL Server / PostgreSQL / JavaScript / HTML / CSS</text></g>
  <g class="linha terceira"><text x="30" y="206"><tspan fill="#79b8ff">mobile  </tspan> Flutter / Dart · também: Java</text></g>
  <rect x="30" y="224" width="11" height="3" fill="#ffc56e" class="cursor"/>
</svg>
